name: CI & Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # build installers on demand — and optionally publish a release
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v7.0.0). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: write # tauri-action needs this to publish a Release

jobs:
  # Fast feedback on every push/PR: typecheck + lint + the parity suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/check-version-sync.mjs
      - name: Every version must have a changelog entry
        # Keeps the notes honest: bumping the version without writing what
        # changed fails here rather than shipping a blank update prompt.
        run: node scripts/changelog-section.mjs "v$(node -p "require('./package.json').version")" > /dev/null
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Single source of truth for "is this a release, and under what tag" — a v*
  # tag push and a workflow_dispatch carrying release_tag both land here, so the
  # build jobs stay free of nested conditionals.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      name: ${{ steps.t.outputs.name }}
    steps:
      - id: t
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then
            echo "name=Sweatbox Builder $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi
          echo "release tag: ${TAG:-<none — artifacts only>}"

  # Windows installers (.msi + NSIS .exe) + standalone .exe.
  windows-build:
    needs: [test, meta]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Job-level so the guard step below can test whether the key exists: the
    # `secrets` context is not available in a step-level `if`, but `env` is.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Sync app version to the release tag
        if: needs.meta.outputs.tag != ''
        # Patch the version on the runner only (never committed) so installers
        # and the in-app version always match the tag being released.
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: node scripts/sync-version.mjs
      - name: Disable updater artifacts when no signing key is available
        # The bundler hard-fails on createUpdaterArtifacts with a pubkey but no
        # private key, which would break forks and any build predating the
        # secret. Without the key we simply ship installers as before.
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: node scripts/set-updater-artifacts.mjs false
      - name: Build app + installers
        # The signing vars come from the job env above; the bundler writes a
        # .sig next to each installer. The password var must be present (empty)
        # or the CLI prompts for it and the job hangs.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installers as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sweatbox-builder-windows
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/*.exe

  # macOS .dmg (universal: Apple Silicon + Intel in one image).
  macos-build:
    needs: [test, meta]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Sync app version to the release tag
        if: needs.meta.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: node scripts/sync-version.mjs
      - name: Disable updater artifacts when no signing key is available
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: node scripts/set-updater-artifacts.mjs false
      - name: Build app + DMG
        # Signing vars come from the job env; with them the bundler also emits
        # the .app.tar.gz the macOS updater installs, tarred AFTER notarization
        # so the ticket is preserved.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing + notarization — all optional: when the APPLE_* secrets
          # are unset the build simply produces an unsigned DMG as before.
          # APPLE_CERTIFICATE is the base64 of a Developer ID Application .p12.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin
      - name: Name the updater archive for the release
        # The bundler writes "Sweatbox Builder.app.tar.gz" — a space, and no
        # version. gh would publish that as Sweatbox.Builder.app.tar.gz, which
        # collides across releases. Rename to match the other assets; the
        # signature covers the bytes, not the filename, so this is safe.
        if: ${{ needs.meta.outputs.tag != '' }}
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          V="${TAG#v}"
          for ext in "" ".sig"; do
            src="Sweatbox Builder.app.tar.gz$ext"
            [ -f "$src" ] || continue
            mv "$src" "Sweatbox.Builder_${V}_universal.app.tar.gz$ext"
          done
          ls -la
      - name: Upload DMG + updater archive as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sweatbox-builder-macos
          if-no-files-found: warn
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig

  # Publish the Release once both platforms are built. Doing it here (instead of
  # in tauri-action) keeps the builders parallel, makes exactly one job create
  # the release, and works identically for a v* tag push and for a
  # workflow_dispatch carrying release_tag — gh creates the tag when missing.
  release:
    needs: [meta, windows-build, macos-build]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish installers to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          TITLE: ${{ needs.meta.outputs.name }}
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.app.tar.gz' \) -exec cp {} upload/ \;
          ls -la upload
          [ -n "$(ls -A upload)" ] || { echo "no installers found to publish"; exit 1; }
          # Release notes come from CHANGELOG.md so the Releases page and the
          # in-app update prompt both show notes written for mentors, not a
          # bare compare link. Falls back to generated notes if the version has
          # no section yet.
          if node scripts/changelog-section.mjs "$TAG" > notes.md; then
            NOTES=(--notes-file notes.md)
          else
            echo "no CHANGELOG entry for $TAG — falling back to generated notes"
            NOTES=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
            gh release edit "$TAG" "${NOTES[@]}"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
              "${NOTES[@]}" upload/*
          fi
          gh release view "$TAG" --json url,assets
      - name: Publish the updater manifest
        # Built AFTER the release exists so the in-app dialog can show the real
        # generated release notes. Skipped when the build produced no
        # signatures (no signing key) — the release is still perfectly valid,
        # it just cannot be installed in place by older versions.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          if ! find artifacts -type f -name '*.sig' | grep -q .; then
            echo "no .sig files in this build — skipping latest.json"
            exit 0
          fi
          gh release view "$TAG" --json body -q .body > notes.md || true
          node scripts/build-latest-json.mjs --tag "$TAG" --sigs artifacts \
            --out upload/latest.json --notes notes.md
          cat upload/latest.json
          gh release upload "$TAG" upload/latest.json --clobber
